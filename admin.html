<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2a23;--mut:#8a7a72;--gold:#c8a460;--g2:#e6d3a8;--rose:#f5e4df;--bg:#faf5f2;--rg:#a45d68;--ok:#1f9d57;--card:#fff;--ln:#eadbd3}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.5 Quicksand,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}h1{font-size:34px}h2{font-size:30px}h3{font-size:22px;margin:26px 0 8px}
button{font:inherit;cursor:pointer}a{color:var(--rg)}
.lg{max-width:380px;margin:12vh auto;padding:36px 30px;background:var(--card);border:1px solid var(--ln);border-radius:24px;box-shadow:0 30px 60px #3a2a2312}.lg h1{margin-bottom:18px}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--ln);border-radius:12px;font:inherit;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}input:focus,textarea:focus,select:focus{outline:0;border-color:var(--rg);box-shadow:0 0 0 3px #a45d6822}
textarea{resize:vertical;line-height:1.5}input[type=checkbox]{width:auto}input[type=file]{padding:8px;font-size:13px}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#mn{padding:34px clamp(18px,4vw,48px) 100px;max-width:1080px;width:100%}
.hd{margin-bottom:22px}.hd p{color:var(--mut);margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px 22px;margin-bottom:16px}
.fld{margin:0 0 14px}.fld>label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.fld small{display:block;color:var(--mut);margin-top:4px;font-size:12.5px}
details.gp{background:var(--card);border:1px solid var(--ln);border-radius:20px;margin-bottom:12px;overflow:hidden}details.gp>summary{cursor:pointer;list-style:none;padding:16px 22px;font-weight:700;display:flex;justify-content:space-between;align-items:center}details.gp>summary::-webkit-details-marker{display:none}details.gp>summary::after{content:"+";color:var(--rg);font-size:22px;line-height:1}details.gp[open]>summary::after{content:"–"}details.gp>.bd2{padding:2px 22px 10px}
.btn{background:var(--rg);color:#fff;border:0;border-radius:99px;padding:10px 20px;font-weight:700;transition:transform .2s,filter .2s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.g{background:#fff;color:var(--ink);border:1px solid var(--ln)}.btn.d{background:#fff;color:#b3261e;border:1px solid #f0c8c4}.btn.sm{padding:6px 14px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar input,.bar select{width:auto;flex:1 1 200px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--ln)}.tabs button{background:none;border:0;padding:10px 16px;font-weight:700;color:var(--mut);border-bottom:2.5px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--rg);border-color:var(--rg)}.tabs .bd{background:var(--rose);color:var(--rg);border-radius:99px;padding:0 8px;font-size:12px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mc{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px}.mc .pv{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--rose);display:block;margin-bottom:10px}.mc b{display:block;margin-bottom:8px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px 18px}.stat b{display:block;font:500 38px/1 "Cormorant Garamond",Georgia,serif;color:var(--rg)}.stat span{font-size:13px;color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}.chart i{flex:1;background:linear-gradient(180deg,var(--rg),var(--gold));border-radius:4px 4px 0 0;min-height:2px;opacity:.9;position:relative}.chart i:hover{opacity:1}.chart i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:2px 8px;border-radius:8px;white-space:nowrap;margin-bottom:4px}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rose);padding:11px 2px}.todo:last-child{border:0}.todo .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--g2);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}.todo.ok .dot{background:var(--ok);border-color:var(--ok)}.todo.ok{color:var(--mut)}.todo span.go{margin-left:auto;color:var(--rg);font-weight:700;font-size:13px}
.it{background:var(--card);border:1px solid var(--ln);border-radius:16px;margin-bottom:10px;overflow:hidden}.it>summary{cursor:pointer;padding:13px 18px;display:flex;gap:10px;align-items:center;list-style:none}.it>summary::-webkit-details-marker{display:none}.it>summary b{flex:1;font-weight:600}.it>.bd2{padding:4px 18px 16px}
.tg{font-size:11px;font-weight:700;background:var(--rose);color:var(--rg);border-radius:99px;padding:2px 10px;white-space:nowrap}.tg.w{background:#fdecc8;color:#8a5a00}.tg.o{background:#eee;color:#777}
.pv2{max-width:200px;max-height:160px;border-radius:12px;display:block;margin:6px 0}
.sw{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px}.sw input{width:18px;height:18px}
.res{background:var(--rose);border-radius:16px;padding:14px 16px;margin-top:12px;white-space:pre-wrap}.res small{display:block;color:var(--rg);font-weight:700;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase;font-size:11px}
table{border-collapse:collapse;width:100%}td,th{padding:9px 12px 9px 0;text-align:left;border-bottom:1px solid var(--rose)}
iframe.mp{width:100%;height:260px;border:0;border-radius:16px;background:var(--rose);margin-top:8px}
#t{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 22px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:50;font-weight:600}#t.on{opacity:1}
@media(max-width:860px){.shell{grid-template-columns:1fr}
#mn{padding-top:22px}h1,h2{font-size:28px}}
</style><link rel="stylesheet" href="painel.css?v=3"></head><body><div id="app"></div><div id="t"></div>
<script type="module" src="admin.js?v=11"></script></body></html>
