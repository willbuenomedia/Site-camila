# Segunda proteção contra pausa do Supabase (independente do Vercel).
# Todo dia chama /api/ping do site. Se o banco não responder, o GitHub avisa por e-mail (falha do workflow).
name: anti-pausa
on:
  schedule: [{cron: '17 11 * * *'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/ping (3 tentativas)
        run: |
          for i in 1 2 3; do
            r=$(curl -fsS --max-time 30 https://camilamigueis-two.vercel.app/api/ping || true)
            echo "$r"
            echo "$r" | grep -q '"ok":true' && exit 0
            sleep 20
          done
          echo "::error::Supabase não respondeu ao ping: $r"; exit 1
