<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#b0604a"><title>Balcão · Clínica Camila Migueis</title>
<link rel="manifest" href="/manifest.json"><link rel="icon" href="assets/icons/icon-192.png"><link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<style>
:root{--ink:#3b2f2a;--mut:#6b6764;--gold2:#e6d3a8;--rose:#f5e4df;--terra:#b0604a}*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,Segoe UI,sans-serif;color:var(--ink);background:#fdfaf9}.mut{color:var(--mut)}.err{color:#b3261e;min-height:22px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid var(--gold2)}header b{flex:1}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;background:var(--rose)}nav button{background:#fff;color:var(--ink);border:1px solid var(--gold2)}nav button.on{background:var(--terra);color:#fff;border-color:var(--terra)}
main{max-width:960px;margin:auto;padding:10px 20px 80px}h2{font-family:Georgia,serif;font-weight:500}h3{margin:22px 0 6px;text-transform:capitalize}
button{background:var(--terra);color:#fff;border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;margin:3px}button.g{background:#fff;color:var(--ink);border:1px solid var(--gold2)}button.wa{background:#1f9d55}
.card{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--gold2);border-radius:14px;padding:12px 16px;margin:8px 0}.ac{display:flex;flex-wrap:wrap}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}input,select,textarea{padding:9px 12px;border:1px solid var(--gold2);border-radius:10px;font:inherit;max-width:100%}.star{color:#c9a86a}
.lg{max-width:360px;margin:12vh auto;display:grid;gap:10px;padding:0 20px}.lg h1{font-family:Georgia,serif;font-weight:500;margin:0}
.md{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:9;padding:16px}.box{background:#fff;border-radius:16px;padding:20px;width:min(520px,100%);display:grid;gap:10px}.box textarea{width:100%}
#print{display:none}@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000}#print table{width:100%;border-collapse:collapse;margin-bottom:18px}#print th,#print td{border:1px solid #999;padding:6px 8px;text-align:left}#print td:last-child{width:22%}#print h1,#print h2{font-family:Georgia,serif}}
</style></head><body><div id="app"></div><div id="print"></div><script type="module" src="balcao.js"></script></body></html>
